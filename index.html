<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WonderWall · 원더월</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #111111;
    --paper-dim: #444444;
    --amber: #b86b00;
    --paper: #111111;
    --brick: #a24a34;
    --brick-lt: #c06146;
    --brick-dk: #7a3423;
    --mortar: #2a2422;
    --mint: #2e6e52;
    --danger: #c65a4a;
    --shadow: 0 10px 30px rgba(0,0,0,.08);
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #f4f1ea;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink) !important;
    display: flex;
    justify-content: center;
    padding: 16px 8px 32px;
  }

  .app {
    width: 100%;
    max-width: 460px;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  header h1 {
    font-family: 'Do Hyeon', sans-serif;
    font-size: 30px;
    letter-spacing: 1px;
    margin: 0 0 4px;
    color: var(--amber);
  }

  header h1 span {
    color: var(--amber);
  }

  header p {
    margin: 0;
    font-size: 13px;
    color: var(--paper-dim);
  }

  .card {
    background: #ffffff;
    border: 1px solid rgba(0,0,0,.08);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }

  .add-row {
    display: flex;
    gap: 8px;
  }

  .add-row input {
    flex: 1;
    background: #f9f8f6;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 11px 12px;
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
  }

  .add-row input::placeholder {
    color: #999;
  }

  .add-row input:focus {
    outline: none;
    border-color: var(--amber);
    background: #fff;
  }

  .add-row button {
    background: var(--amber);
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-family: 'Do Hyeon', sans-serif;
    font-size: 15px;
    color: #ffffff;
    cursor: pointer;
  }

  .add-row button:active {
    transform: scale(.96);
  }

  ul.todos {
    list-style: none;
    margin: 14px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }

  ul.todos:empty {
    display: none;
  }

  ul.todos li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f9f8f6;
    border-radius: 10px;
    padding: 9px 10px;
    border: 1px solid #eee;
  }

  ul.todos li .box {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    border-radius: 6px;
    border: 2px solid var(--mint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }

  ul.todos li.done .box {
    background: var(--mint);
  }

  ul.todos li .box svg {
    width: 12px;
    height: 12px;
    opacity: 0;
  }

  ul.todos li.done .box svg {
    opacity: 1;
  }

  ul.todos li span.txt {
    flex: 1;
    font-size: 14px;
    word-break: break-all;
    cursor: text;
    color: var(--ink);
  }

  ul.todos li.done span.txt {
    text-decoration: line-through;
    color: #888888;
  }

  ul.todos li input.edit-input {
    flex: 1;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    border: 1px solid var(--amber);
    border-radius: 6px;
    color: var(--ink);
    padding: 3px 6px;
  }

  ul.todos li .edit {
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 2px 4px;
    opacity: 0;
    transition: opacity .15s;
  }

  ul.todos li:hover .edit {
    opacity: 1;
  }

  ul.todos li .edit:hover {
    color: var(--amber);
  }

  ul.todos li .del {
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
  }

  ul.todos li .del:hover {
    color: var(--danger);
  }

  .empty-msg {
    text-align: center;
    font-size: 13px;
    color: #888;
    padding: 10px 0 2px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }

  .progress-track {
    flex: 1;
    height: 8px;
    background: #eee;
    border-radius: 5px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--mint), var(--amber));
    width: 0%;
    transition: width .4s ease;
  }

  .progress-label {
    font-family: 'Do Hyeon', sans-serif;
    font-size: 14px;
    color: var(--amber);
    min-width: 38px;
    text-align: right;
  }

  /* WALL */

  .wall-card {
    padding: 0;
    overflow: hidden;
    position: relative;
  }

  .wall-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 0;
  }

  .wall-head .title {
    font-family: 'Do Hyeon', sans-serif;
    font-size: 15px;
    color: var(--paper-dim);
  }

  .wall-head-actions {
    display: flex;
    gap: 6px;
  }

  .head-btn {
    background: #f4f1ea;
    border: 1px solid #ddd;
    border-radius: 8px;
    height: 32px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    font-family: 'Do Hyeon', sans-serif;
  }

  .head-btn:hover {
    background: #eae5dc;
  }

  .theme-bar {
    display: flex;
    gap: 6px;
    padding: 10px 16px 0;
    overflow-x: auto;
  }

  .theme-btn {
    background: #f4f1ea;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--paper-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }

  .theme-btn:hover {
    color: var(--ink);
    border-color: #bbb;
  }

  .theme-btn.active {
    background: var(--amber);
    color: #fff;
    font-weight: bold;
    border-color: var(--amber);
  }

  .wall-stage {
    position: relative;
    margin: 12px 16px 14px;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 4 / 3;
    background: #111;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.1);
  }

  .bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.5s ease;
  }

  .brick-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(6, 1fr);
  }

  .brick {
    background: linear-gradient(160deg, var(--brick-lt), var(--brick));
    border: 1px solid var(--mortar);
    transform-origin: center;
    transition:
      transform .55s cubic-bezier(.34,1.56,.64,1),
      opacity .5s ease;
  }

  .brick:nth-child(odd) {
    background: linear-gradient(160deg, var(--brick), var(--brick-dk));
  }

  .brick.gone {
    opacity: 0;
    transform: scale(.15) rotate(35deg) translateY(30px);
    pointer-events: none;
  }

  .wall-caption {
    padding: 0 16px 16px;
    font-size: 12.5px;
    color: var(--paper-dim);
    text-align: center;
  }

  .msg-card {
    display: none;
    text-align: center;
    padding: 20px 16px;
    position: relative;
    color: var(--ink);
    background: #fff;
  }

  .msg-card.show {
    display: block;
    animation: pop .5s ease;
  }

  .msg-close-btn {
    position: absolute;
    top: 10px;
    right: 12px;
    background: none;
    border: none;
    color: var(--paper-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
  }

  .msg-close-btn:hover {
    color: var(--ink);
  }

  @keyframes pop {
    0% {
      transform: scale(.85);
      opacity: 0;
    }

    100% {
      transform: scale(1);
      opacity: 1;
    }
  }

  .msg-tag {
    display: inline-block;
    font-family: 'Do Hyeon', sans-serif;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
  }

  .msg-tag.cheer {
    background: #e1f3ec;
    color: var(--mint);
  }

  .msg-tag.savage {
    background: #fae8e6;
    color: var(--danger);
  }

  .msg-tag.reward {
    background: #fef3d8;
    color: var(--amber);
  }

  .msg-text {
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0 0 16px;
    white-space: pre-line;
  }

  .msg-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .msg-actions button {
    font-family: 'Do Hyeon', sans-serif;
    font-size: 14px;
    border-radius: 10px;
    padding: 9px 14px;
    cursor: pointer;
    border: none;
  }

  .btn-next {
    background: var(--amber);
    color: #fff;
  }

  .btn-log {
    background: #f4f1ea;
    color: var(--ink);
    border: 1px solid #ddd !important;
  }

  /* MODAL */

  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }

  .modal-bg.show {
    display: flex;
  }

  .modal {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 400px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
    color: var(--ink);
  }

  .modal h2 {
    font-family: 'Do Hyeon', sans-serif;
    font-size: 18px;
    margin: 0 0 4px;
    color: var(--amber);
  }

  .modal p.sub {
    margin: 0 0 14px;
    font-size: 12.5px;
    color: var(--paper-dim);
  }

  .modal .close {
    float: right;
    background: none;
    border: none;
    color: var(--paper-dim);
    font-size: 20px;
    cursor: pointer;
  }

  .log-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .stamp-card {
    --stamp-bg: #f8f4ec;
    --stamp-border: #d4cbb8;
    --stamp-ink: #9c4a4a;

    background: var(--stamp-bg);
    padding: 10px 10px 14px;
    border-radius: 3px;
    position: relative;
    cursor: pointer;
    user-select: none;
    border: 1.5px dashed var(--stamp-border);

    box-shadow:
      0 0 0 6px var(--stamp-bg),
      0 4px 12px rgba(0, 0, 0, 0.1),
      0 1px 3px rgba(0, 0, 0, 0.05);

    transition:
      transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.25s ease;
  }

  .stamp-card:hover {
    transform: translateY(-6px) rotate(1.2deg);
    box-shadow:
      0 0 0 6px var(--stamp-bg),
      0 12px 24px rgba(0, 0, 0, 0.15),
      0 4px 8px rgba(0, 0, 0, 0.08);
  }

  .stamp-card:active {
    transform: translateY(-2px) rotate(0.5deg);
    transition-duration: 0.1s;
  }

  .stamp-img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 2px;
    display: block;
  }

  .stamp-date {
    margin-top: 8px;
    text-align: center;
    font-family: 'Courier New', 'Courier', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--stamp-ink);
    letter-spacing: -0.3px;
    opacity: 0.9;
    transform: rotate(-1deg);
  }

  .stamp-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }

  .stamp-modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .stamp-modal {
    background: #fdfbf7;
    padding: 16px 16px 20px;
    border-radius: 6px;
    max-width: 90vw;
    max-height: 85vh;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    transform: scale(0.92) translateY(20px);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center;
  }

  .stamp-modal-overlay.active .stamp-modal {
    transform: scale(1) translateY(0);
  }

  .stamp-modal img {
    width: 100%;
    max-height: 50vh;
    object-fit: contain;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .stamp-modal-date {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: #9c4a4a;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .stamp-modal-message {
    font-size: 0.95rem;
    color: #444;
    line-height: 1.5;
    max-width: 320px;
    margin: 0 auto 14px;
  }

  .btn-delete-stamp {
    background: var(--danger);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    font-family: 'Do Hyeon', sans-serif;
    cursor: pointer;
  }

  .btn-delete-stamp:hover {
    opacity: 0.9;
  }
</style>
</head>

<body>

<div class="app">

  <header>
    <h1>Wonder<span>Wall</span></h1>
    <p>할 일을 끝낼 때마다, 벽 너머 풍경이 조금씩 드러나요</p>
  </header>

  <div class="card wall-card">

    <div class="wall-head">
      <div class="title">🧱 벽 너머 풍경</div>

      <div class="wall-head-actions">
        <button
          class="head-btn"
          id="notionLoginBtn"
          title="내 노션 계정 연동하기">
          🔗 노션연동
        </button>

        <button
          class="head-btn"
          id="headerLogBtn"
          title="도감 보기">
          📖
        </button>

        <button
          class="head-btn"
          id="soundBtn"
          title="효과음 켜기/끄기">
          🔊
        </button>
      </div>
    </div>

    <div class="theme-bar" id="themeBar">
      <button class="theme-btn active" data-theme="photo">📷 사진</button>
      <button class="theme-btn" data-theme="pixel">👾 픽셀</button>
      <button class="theme-btn" data-theme="illustration">🎨 일러스트</button>
      <button class="theme-btn" data-theme="pattern">🧩 패턴</button>
      <button class="theme-btn" data-theme="3d">🧊 3D</button>
    </div>

    <div class="wall-stage" id="wallStage">
      <img
        id="bgImage"
        class="bg-image"
        src=""
        alt="Wall Background Landscape"
      />

      <div class="brick-grid" id="brickGrid"></div>
    </div>

    <div class="wall-caption" id="wallCaption">
      벽돌 48개 · 할 일을 완료해서 하나씩 무너뜨려봐
    </div>

    <div class="msg-card" id="msgCard">

      <button
        class="msg-close-btn"
        id="msgCloseBtn"
        title="닫기">
        ✕
      </button>

      <div class="msg-tag" id="msgTag"></div>

      <p class="msg-text" id="msgText"></p>

      <div class="msg-actions">
        <button class="btn-next" id="nextWallBtn">
          새 벽 쌓기
        </button>

        <button class="btn-log" id="openLogBtn">
          도감 보기
        </button>
      </div>

    </div>

  </div>


  <div class="card">

    <div class="add-row">
      <input
        id="todoInput"
        type="text"
        placeholder="오늘 할 일을 적어봐"
        maxlength="60"
      >

      <button id="addBtn">
        추가
      </button>
    </div>

    <ul class="todos" id="todoList"></ul>

    <div class="empty-msg" id="emptyMsg">
      할 일을 추가하면 벽돌이 무너지기 시작해요
    </div>

    <div class="progress-row">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="progress-label" id="progressLabel">
        0%
      </div>
    </div>

  </div>

</div>


<!-- 도감 모달 -->

<div class="modal-bg" id="logModal">

  <div class="modal">

    <button class="close" id="closeLogBtn">
      ×
    </button>

    <h2>
      📖 발견한 풍경 도감
    </h2>

    <p class="sub" id="logSub">
      아직 모은 풍경이 없어요
    </p>

    <div class="log-grid" id="logGrid"></div>

  </div>

</div>


<!-- 풍경 상세 모달 -->

<div class="stamp-modal-overlay" id="stampModal">

  <div class="stamp-modal">

    <img src="" alt="확대 풍경">

    <div class="stamp-modal-date"></div>

    <div class="stamp-modal-message"></div>

    <button
      class="btn-delete-stamp"
      id="deleteStampBtn">
      🗑️ 이 사진 삭제하기
    </button>

  </div>

</div>


<script>
(function(){

  /* =========================================================
     1. NOTION OAuth 정보
     ========================================================= */

  const urlParams = new URLSearchParams(window.location.search);

  const tokenParam = urlParams.get('notion_token');
  const dbParam = urlParams.get('notion_db');
  const errorParam = urlParams.get('notion_error');


  if (tokenParam) {

    localStorage.setItem(
      'wonderwall_notion_token',
      tokenParam
    );

    if (dbParam) {
      localStorage.setItem(
        'wonderwall_notion_db',
        dbParam
      );
    }

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    if (dbParam) {

      alert(
        '노션 연동이 성공적으로 완료되었습니다! 🎉\n\n' +
        '이제 위젯과 노션이 서로 연결됩니다.'
      );

    } else {

      alert(
        '로그인은 됐지만 연결할 데이터베이스를 찾지 못했어요.\n\n' +
        'Notion에서 "할 일" DB에 이 연동(Integration)을 먼저 추가해주세요.'
      );

    }

  } else if (errorParam) {

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    alert(
      '노션 연동 중 문제가 발생했습니다: ' +
      errorParam
    );

  }


  const userNotionToken =
    localStorage.getItem('wonderwall_notion_token');

  const userNotionDb =
    localStorage.getItem('wonderwall_notion_db');


  document
    .getElementById('notionLoginBtn')
    .addEventListener('click', () => {

      window.location.href = '/api/auth/login';

    });


  /* =========================================================
     2. 기본 설정
     ========================================================= */

  const PIXABAY_API_KEY =
    '57149296-9d10be9789526d423ac583461';

  const FALLBACK_IMAGE =
    'https://cdn.pixabay.com/photo/2018/08/14/13/23/ocean-3605547_1280.jpg';


  const LS_TODOS =
    'wonderwall_todos_v3';

  const LS_SOUND =
    'wonderwall_sound_v3';

  const LS_LOG =
    'wonderwall_collection_v3';

  const LS_IMAGE =
    'wonderwall_current_img_v3';

  const LS_THEME =
    'wonderwall_theme_v3';

  const LS_ORDER =
    'wonderwall_order_v3';

  const LS_REMOVED =
    'wonderwall_removed_v3';

  const TOTAL_BRICKS = 48;


  const THEME_CONFIG = {

    photo: {
      q: 'landscape,nature',
      type: 'photo'
    },

    pixel: {
      q: 'pixel art',
      type: 'illustration'
    },

    illustration: {
      q: 'fantasy landscape,illustration',
      type: 'illustration'
    },

    pattern: {
      q: 'abstract pattern,texture',
      type: 'all'
    },

    '3d': {
      q: 'miniature diorama',
      type: 'illustration'
    }

  };


  const messages = {

    cheer: [
      '오늘 몫을 다 해냈어. 잘했어, 진짜로.',
      '벽 하나를 통째로 무너뜨렸네. 오늘 좀 멋진데?',

  function shuffledOrder() {

    const arr =
      Array.from(
        { length: TOTAL_BRICKS },
        (_, i) => i
      );

    for (
      let i = arr.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [arr[i], arr[j]] =
        [arr[j], arr[i]];

    }

    return arr;

  }

  /*
   * ⭐ 핵심
   *
   * Notion → 위젯
   *
   * 페이지를 열었을 때 Notion DB를 읽어온다.
   */
  async function loadTodosFromNotion() {

    if (!notionConnected) {
      return;
    }

    isLoadingFromNotion = true;

    try {

      const params = new URLSearchParams({

        notionToken: userNotionToken,

        notionDb: userNotionDb

      });


      const res =
        await fetch(
          `/api/notion?${params.toString()}`
        );


      const result =
        await res.json();


      if (!res.ok || !result.success) {

        console.error(
          'Notion 불러오기 실패:',
          result
        );

        return;

      }


      /*
       * Notion에서 받은 데이터를
       * 위젯의 todos 배열에 그대로 넣는다.
       */
      todos =
        (result.todos || []).map(t => ({

          id: t.id,

          text: t.text || '',

          completed: !!t.completed,

          notionPageId:
            t.notionPageId || t.id

        }));


      saveTodos();

      renderTodos();

      console.log(
        '✅ Notion → Widget 동기화 완료',
        todos
      );

    } catch (error) {

      console.error(
        'Notion 데이터 불러오기 오류:',
        error
      );

    } finally {

      isLoadingFromNotion = false;

    }

  }


  /*
   * 위젯 → Notion
   *
   * POST:
   * 새로운 할 일 생성
   *
   * PATCH:
   * 기존 할 일 수정
   */
  async function syncToNotion(
    taskText,
    isDone,
    pageId
  ) {

    if (!notionConnected) {

      console.warn(
        '노션 연동이 아직 되어있지 않습니다.'
      );

      return null;

    }


    try {

      const method =
        pageId ? 'PATCH' : 'POST';


      const res =
        await fetch(
          '/api/notion',
          {

            method,

            headers: {
              'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

              task: taskText,

              done: isDone,

              pageId:
                pageId || null,

              notionToken:
                userNotionToken,

              notionDb:
                userNotionDb

            })

          }
        );


      const result =
        await res.json();


      if (!res.ok) {

        console.error(
          'Notion 동기화 실패:',
          result
        );

        return null;

      }


      return result;

    } catch (error) {

      console.error(
        'Notion sync failed:',
        error
      );

      return null;

    }

  }


  /*
   * ⭐ Notion 페이지 삭제
   *
   * 위젯에서 X를 눌렀을 때 사용
   */
  async function deleteFromNotion(pageId) {

    if (
      !notionConnected ||
      !pageId
    ) {
      return null;
    }


    try {

      const res =
        await fetch(

            },

            body: JSON.stringify({

      if (!res.ok) {

        console.error(

          result
        );

        return null;

      }


      console.log(

      );


      return result;

    } catch (error) {

      console.error(

      );

  }


  /*
   * 새 할 일을 생성하는 동안 체크했을 경우
   *
   * 생성 완료 → 체크 상태 업데이트

  async function syncCheckAfterCreate(t) {

    const pending =
      pendingNotionCreates.get(t.id);


    if (pending) {

      await pending;

    }


    if (!t.notionPageId) {
      return;
    }


    await syncToNotion(
      t.text,
      t.completed,
      t.notionPageId
    );

  }

  let audioCtx = null;


  function getCtx() {

    if (!audioCtx) {

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioCtx.state ===
      'suspended'
    ) {

      audioCtx.resume();

    }


    return audioCtx;

  }


  window.addEventListener(
    'click',
    () => getCtx(),
    { once: true }
  );


  function playCrumble() {

    if (!soundOn) {
      return;
    }


    try {

      const ctx =
        getCtx();

      const now =
        ctx.currentTime;


      const osc =
        ctx.createOscillator();

      const oscGain =
        ctx.createGain();


      osc.type =
        'triangle';

      osc.frequency.setValueAtTime(
        280,
        now
      );

      osc.frequency.exponentialRampToValueAtTime(
        40,
        now + 0.08
      );


      oscGain.gain.setValueAtTime(
        0.8,
        now
      );

      oscGain.gain.exponentialRampToValueAtTime(
        0.01,
        now + 0.08
      );


      osc.connect(oscGain);

      oscGain.connect(
        ctx.destination
      );


      osc.start(now);

      osc.stop(
        now + 0.08
      );

    } catch(e) {}

  }


  function playAchieve() {

    if (!soundOn) {
      return;
    }


    try {

      const ctx =
        getCtx();

      const now =
        ctx.currentTime;


      [
        659.25,
        783.99,
        987.77,
        1174.66,
        1567.98
      ].forEach(
        (freq, idx) => {

          const osc =
            ctx.createOscillator();

          const gain =
            ctx.createGain();


          osc.type =
            'sine';

          osc.frequency.setValueAtTime(
            freq,
            now + idx * 0.07
          );


          gain.gain.setValueAtTime(
            0,
            now + idx * 0.07
          );


          gain.gain.linearRampToValueAtTime(
            0.35,
            now + idx * 0.07 + 0.015
          );


          gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + idx * 0.07 + 0.3
          );


          osc.connect(gain);

          gain.connect(
            ctx.destination
          );


          osc.start(
            now + idx * 0.07
          );

          osc.stop(
            now + idx * 0.07 + 0.3
          );

        }
      );

    } catch(e) {}

  }

  /* =========================================================

  function updateProgress() {

    const total =
      todos.length;


    const done =
      todos.filter(
        t => t.completed
      ).length;


    const percent =
      total === 0
        ? 0
        : Math.round(
            (done / total) * 100
          );


    progressFill.style.width =
      percent + '%';


    progressLabel.textContent =
      percent + '%';


    const targetRemoved =
      Math.floor(
        (percent / 100) *
        TOTAL_BRICKS
      );


    let messageDelay =
      500;


    if (
      targetRemoved >
      removedCount
    ) {

      const toRemove =
        order.slice(
          removedCount,
          targetRemoved
        );


      toRemove.forEach(
        (brickIndex, i) => {

          setTimeout(
            () => {

              brickEls[
                brickIndex
              ].classList.add(
                'gone'
              );

              playCrumble();

            },
            i * 70
          );

        }
      );


      messageDelay =
        Math.max(
          toRemove.length * 70 + 400,
          650
        );


      removedCount =
        targetRemoved;


    } else if (
      targetRemoved <
      removedCount
    ) {

      brickEls.forEach(
        (el, idx) => {

          const shouldBeGone =
            order.indexOf(idx) <
            targetRemoved;


          el.classList.toggle(
            'gone',
            shouldBeGone
          );

        }
      );


      removedCount =
        targetRemoved;

    }


    localStorage.setItem(
      LS_REMOVED,
      String(removedCount)
    );


    wallCaption.textContent =
      total === 0
        ? '벽돌 48개 · 할 일을 완료해서 하나씩 무너뜨려봐'
        : `벽돌 ${TOTAL_BRICKS - removedCount}개 남음 · ${done}/${total} 완료`;


    if (
      percent === 100 &&
      total > 0 &&
      !celebrated
    ) {

      celebrated = true;


      setTimeout(
        showMessage,
        messageDelay
      );

    }


    if (
      percent < 100
    ) {

      celebrated = false;

      msgCard.classList.remove(
        'show'
      );

    }

  }

  function addTodo() {

    const val =
      todoInput.value.trim();


    if (!val) {
      return;
    }


    const newTodo = {

      /*
       * Notion과 연결되기 전
       * 임시 위젯 ID
       */
      id:
        Date.now() +
        Math.random(),

      text:
        val,

      completed:
        false,

      notionPageId:
        null

    };


    todos.push(
      newTodo
    );


    todoInput.value =
      '';


    saveTodos();

    renderTodos();


    /*
     * Notion에 새 페이지 생성
     */
    const createPromise =
      syncToNotion(
        val,
        false,
        null
      ).then(
        result => {

          if (
            result &&
            result.data &&
            result.data.id
          ) {

            /*
             * Notion 페이지 ID 저장
             */
            newTodo.notionPageId =
              result.data.id;


            /*
             * 다음부터는
             * 이 ID를 이용해서
             * PATCH / DELETE
             */
            newTodo.id =
              result.data.id;


            saveTodos();

            renderTodos();

          }


          pendingNotionCreates.delete(
            newTodo.id
          );


          return result;

        }
      );


    pendingNotionCreates.set(
      newTodo.id,
      createPromise
    );

  }

     ========================================================= */

  todoListEl.addEventListener(
    'click',
    async e => {

      const box =
        e.target.closest(
          '.box'
        );


      const del =
        e.target.closest(
          '.del'
        );


      const editBtn =
        e.target.closest(
          '.edit'
        );


      const txt =
        e.target.closest(
          '.txt'
        );


      /* -----------------------------------------
         체크
         ----------------------------------------- */

      if (box) {

        const id =
          box.dataset.id;


        const t =
          todos.find(
            x =>
              String(x.id) ===
              String(id)
          );


        if (!t) {
          return;
        }


        t.completed =
          !t.completed;


        saveTodos();

        renderTodos();


        await syncCheckAfterCreate(
          t
        );


        return;

      }


      /* -----------------------------------------
         삭제
         ----------------------------------------- */

      if (del) {

        const id =
          del.dataset.id;


        const t =
          todos.find(
            x =>
              String(x.id) ===
              String(id)
          );


        if (!t) {
          return;
        }


        /*
         * 먼저 위젯에서 삭제
         */
        todos =
          todos.filter(
            x =>
              String(x.id) !==
              String(id)
          );


        saveTodos();

        renderTodos();


        /*
         * 그리고 Notion에서도 삭제
         */
        if (t.notionPageId) {

          await deleteFromNotion(
            t.notionPageId
          );

        }


        return;

      }


      /* -----------------------------------------
         * 수정
         * ----------------------------------------- */

      if (editBtn || txt) {

        startEdit(
          (editBtn || txt)
            .dataset.id
        );

      }

    }
  );


  /* =========================================================
     17. Todo 수정
     ========================================================= */

  function startEdit(id) {

    const t =
      todos.find(
        x =>
          String(x.id) ===
          String(id)
      );


    if (!t) {
      return;
    }


    const span =
      todoListEl.querySelector(
        `.txt[data-id="${CSS.escape(String(id))}"]`
      );


    if (
      !span ||
      span.tagName === 'INPUT'
    ) {
      return;
    }


    const oldText =
      t.text;


    const input =
      document.createElement(
        'input'
      );


    input.type =
      'text';


    input.className =
      'edit-input';


    input.value =
      t.text;


    span.replaceWith(
      input
    );


    input.focus();

    input.select();


    let committed =
      false;


    const commit =
      async () => {

        if (committed) {
          return;
        }


        committed = true;


        const newText =
          input.value.trim();


        /*
         * 빈칸이면 원래 내용 유지
         */
        if (!newText) {

          t.text =
            oldText;

        } else {

          t.text =
            newText;

        }


        saveTodos();

        renderTodos();


        /*
         * ⭐ 제목이 바뀌었으므로
         * Notion에도 PATCH
         */
        if (
          t.notionPageId
        ) {

          await syncToNotion(

            t.text,

            t.completed,

            t.notionPageId

          );

        }

      };


    input.addEventListener(
      'blur',
      commit
    );


    input.addEventListener(
      'keydown',
      e => {

        if (
          e.key === 'Enter' &&
          !e.isComposing
        ) {

          input.blur();

        }


        if (
          e.key === 'Escape'
        ) {

          committed = true;

          renderTodos();

        }

      }
    );

  }


  /* =========================================================
     18. 사운드
     ========================================================= */

  soundBtn.addEventListener(
    'click',
    () => {

      soundOn =
        !soundOn;


      soundBtn.textContent =
        soundOn
          ? '🔊'
          : '🔇';


      localStorage.setItem(
        LS_SOUND,
        soundOn
          ? 'on'
          : 'off'
      );

    }
  );


  /* =========================================================
     19. 새 벽
     ========================================================= */

  nextWallBtn.addEventListener(
    'click',
    () => {

      /*
       * 주의:
       * 새 벽을 쌓아도 Notion DB의
       * 할 일은 삭제하지 않는다.
       *
       * 양방향 동기화의 기준은 Notion DB이기 때문.
       */

      fetchRandomLandscape(true);


      order =
        shuffledOrder();


      localStorage.setItem(
        LS_ORDER,
        JSON.stringify(order)
      );


      removedCount =
        0;


      localStorage.setItem(
        LS_REMOVED,
        '0'
      );


      brickEls.forEach(
        el =>
          el.classList.remove(
            'gone'
          )
      );


      celebrated =
        false;


      msgCard.classList.remove(
        'show'
      );


  

    }
  );


  /* =========================================================
     20. 도감
     ========================================================= */

  headerLogBtn.addEventListener(
    'click',
    renderLog
  );


  openLogBtn.addEventListener(
    'click',
    renderLog
  );


  closeLogBtn.addEventListener(
    'click',
    () =>
      logModal.classList.remove(
        'show'
      )
  );


  function renderLog() {

    logGrid.innerHTML =
      '';


    if (
      collection.length === 0
    ) {

      logSub.textContent =
        '아직 모은 풍경이 없어요';

    } else {

      logSub.textContent =
        `총 ${collection.length}개의 풍경을 모았어요`;


      collection
        .slice()
        .reverse()
        .forEach(
          (item, originalIndex) => {

            const actualIdx =
              collection.length -
              1 -
              originalIndex;


            const div =
              document.createElement(
                'div'
              );


            div.className =
              'stamp-card';


            div.innerHTML = `

              <img
                class="stamp-img"
                src="${escapeHtml(item.img)}"
                alt="Collection Scene"
              >

              <div class="stamp-date">
                ${escapeHtml(item.date)}
              </div>

            `;


            div.addEventListener(
              'click',
              () => {

                viewingIndex =
                  actualIdx;


                const modal =
                  document.getElementById(
                    'stampModal'
                  );


                modal.querySelector(
                  'img'
                ).src =
                  item.img;


                modal.querySelector(
                  '.stamp-modal-date'
                ).innerText =
                  item.date;


                modal.querySelector(
                  '.stamp-modal-message'
                ).innerText =
                  `"${item.message}"`;


                modal.classList.add(
                  'active'
                );

              }
            );


            logGrid.appendChild(
              div
            );

          }
        );

    }


    logModal.classList.add(
      'show'
    );

  }


  document
    .getElementById(
      'deleteStampBtn'
    )
    .addEventListener(
      'click',
      () => {

        if (
          viewingIndex !== null &&
          viewingIndex >= 0 &&
          viewingIndex <
            collection.length
        ) {

          collection.splice(
            viewingIndex,
            1
          );


          localStorage.setItem(
            LS_LOG,
            JSON.stringify(
              collection
            )
          );


          document
            .getElementById(
              'stampModal'
            )
            .classList.remove(
              'active'
            );


          renderLog();

        }

      }
    );


  document
    .getElementById(
      'stampModal'
    )
    .addEventListener(
      'click',
      e => {

        if (
          e.target ===
          document.getElementById(
            'stampModal'
          )
        ) {

          document
            .getElementById(
              'stampModal'
            )
            .classList.remove(
              'active'
            );

        }

      }
    );


  /* =========================================================
     21. ⭐ 처음 실행
     ========================================================= */

  fetchRandomLandscape();


  /*
   * 먼저 현재 로컬 데이터를 화면에 보여준다.
   */
  renderTodos();


  /*
   * 그리고 Notion에 연결되어 있다면
   * Notion 데이터를 가져와서 덮어쓴다.
   *
   * 이것이 "Notion → 위젯" 부분이다.
   */
  if (notionConnected) {

    loadTodosFromNotion();
    
  }


})();
</script>

</body>
</html>
